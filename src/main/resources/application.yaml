spring:
  application:
    name: dvaas-client
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: codellama:latest
        options:
          temperature: 0.7
      embedding:
        model: nomic-embed-text
      vectorstore:
        pgvector:
          intialize-schema: true
          dimensions: 1536
    mcp:
      client:
        name: dvaas-mcp-client
        version: 0.0.1
        toolcallback:
          enabled: true
        streamable-http:
          connections:
            dvaas:
              url: https://mcp.danvega.dev/mcp

SERVER:
  PORT: 8081